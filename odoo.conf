[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
admin_passwd = admin
proxy_mode = False
http_port = 8069
gevent_port = 8072
workers = 0
limit_time_cpu = 600
limit_time_real = 1200
log_level = info

# Only expose the production database; keeps the login page from showing the
# database chooser when other databases (e.g. test copies) exist. Change this if
# you run scripts/init.sh with a different ODOO_DB.
dbfilter = ^thoughtocean$
