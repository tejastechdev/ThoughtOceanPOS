[options]
; Production config, mounted over /etc/odoo/odoo.conf by deploy/docker-compose.prod.yml.
; Database host/user/password are deliberately absent: the odoo image entrypoint
; fills them from the HOST/USER/PASSWORD environment variables (set in .env).
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Behind Caddy: trust X-Forwarded-* headers so generated URLs use https.
proxy_mode = True
http_port = 8069
gevent_port = 8072

; Multi-process mode. 2 workers is plenty for a single shop; raise on bigger VMs.
workers = 2
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736

; Only the production database is reachable, and the database manager is off.
dbfilter = ^thoughtocean$
list_db = False

log_level = info
